limit_req_zone $binary_remote_addr zone=haulmatch_api:10m rate=10r/s;
server { listen 80; server_name haulmatch.wykiesautomation.co.za; return 301 https://$host$request_uri; }
server {
 listen 443 ssl http2;
 server_name haulmatch.wykiesautomation.co.za;
 ssl_certificate /etc/nginx/certs/origin.pem;
 ssl_certificate_key /etc/nginx/certs/origin.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 10m;
 location /api/ { limit_req zone=haulmatch_api burst=30 nodelay; proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
 location / { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
}
